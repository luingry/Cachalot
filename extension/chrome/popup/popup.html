<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cachalot</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <div class="brand">
          <img src="../icons/active-32.png" width="20" height="20" alt="" />
          <span>Cachalot</span>
          <span id="extVersion" class="version"></span>
        </div>
        <div class="top-tools">
          <button id="showCachalot" class="icon-btn" type="button" title="Abrir o Cachalot" aria-label="Abrir o Cachalot" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="15" rx="2.5" /><path d="M3 9h18" /><path d="M6.5 6.75h.01" /><path d="M9 6.75h.01" />
            </svg>
          </button>
          <button id="openOptions" class="icon-btn" type="button" title="Configurações" aria-label="Configurações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
            </svg>
          </button>
        </div>
      </header>

      <section id="status" class="status card" data-state="checking" aria-live="polite" hidden>
        <div class="status-line">
          <span class="dot"></span>
          <span id="statusText" class="status-text">Procurando o Cachalot…</span>
          <span id="statusMeta" class="meta"></span>
          <button id="retry" class="icon-btn icon-btn-sm" type="button" title="Tentar de novo" aria-label="Tentar de novo" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" />
            </svg>
          </button>
        </div>
        <form id="pairForm" class="pair-form" autocomplete="off" hidden>
          <input
            id="pairInput"
            class="input input-code"
            type="text"
            inputmode="text"
            maxlength="16"
            spellcheck="false"
            placeholder="XXXX-XXXX"
            aria-label="Código de pareamento"
          />
          <button id="pairButton" class="btn btn-primary" type="submit">Parear</button>
        </form>
        <p id="pairHint" class="pair-hint meta" hidden>No Cachalot: Configurações → Extensão do navegador.</p>
        <p id="pairError" class="msg msg-error" hidden></p>
      </section>

      <section class="card page-card">
        <div class="page-head">
          <div class="favicon" aria-hidden="true">
            <img id="favicon" alt="" hidden />
            <span id="faviconFallback"></span>
          </div>
          <div class="page-text">
            <div class="page-source">
              <span id="pageHost" class="overline"></span>
              <span id="pagePlatform" class="platform-tag" hidden></span>
            </div>
            <div id="pageTitle" class="page-title"></div>
          </div>
        </div>
        <div class="actions">
          <button id="sendPage" class="btn btn-primary" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v11" /><path d="m7 10 5 5 5-5" /><path d="M5 20h14" />
            </svg>
            <span>Baixar</span>
          </button>
          <button id="sendAudio" class="btn btn-secondary" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l11-2v13" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" />
            </svg>
            <span>Só áudio</span>
          </button>
        </div>
        <p id="pageFeedback" class="feedback msg" aria-live="polite" hidden></p>
      </section>

      <section class="media">
        <div class="section-head">
          <span class="overline">Mídias detectadas nesta página</span>
          <div class="section-tools">
            <button id="sortOrder" class="icon-btn icon-btn-sm sort-btn" type="button" aria-pressed="false" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 4v16" /><path d="m3.5 16.5 3.5 3.5 3.5-3.5" /><path d="M13 6h8" /><path d="M13 11h6" /><path d="M13 16h4" />
              </svg>
            </button>
            <span id="mediaCount" class="count" hidden></span>
          </div>
        </div>
        <ul id="mediaList" class="media-list"></ul>
        <p id="mediaEmpty" class="empty meta">Nenhuma mídia detectada ainda. Dê play no vídeo e reabra.</p>
        <div id="previewPop" class="preview-pop" aria-hidden="true"></div>
      </section>

    </main>
  </body>
</html>
